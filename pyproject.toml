[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["legacy", ".venv", ".pgdata"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "SIM"]
ignore = [
  "S101",  # assert is used for internal invariants
  "S608",  # SQL assembled from allow-listed column names and bound parameters only; reviewed in tests/test_sql_injection
  "B008",  # FastAPI Depends() in defaults
  "E501",  # long SQL strings
  "SIM108", "UP037", "S105", "S106", "S311",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E731", "E741", "SIM"]
"migrations/*" = ["E501"]
"scripts/*" = ["S603", "S607"]
"sdk/*" = ["UP"]  # the SDK supports Python 3.9+

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["app"]
