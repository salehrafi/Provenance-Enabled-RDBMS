[project]
name = "provenance-cloud"
version = "0.1.0"
description = "Python client for Provenance Cloud: ingest events, query provenance, verify audit integrity, verify webhooks"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["provenance_cloud"]
